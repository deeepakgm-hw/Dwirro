name: Model Evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evals/**'
      - 'packages/ai-core/**'

jobs:
  evals:
    name: Run Evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.8.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Evals
        run: echo "Model evaluations runner pipeline"
